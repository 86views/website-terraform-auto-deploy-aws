name: Deploy Static Website Infrastructure

on:
  push:
    branches: [ main, staging ]
    paths:
      - 'terraform/**'
      - 'website/**'
      - '.github/workflows/deploy.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'terraform/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'prod'
        type: choice
        options:
          - prod
          - staging
      action:
        description: 'Action to perform'
        required: true
        default: 'apply'
        type: choice
        options:
          - plan
          - apply
          - destroy
      skip_slack:
        description: 'Skip Slack notifications'
        required: false
        default: false
        type: boolean

# Permissions for OIDC token (no AWS keys stored in GitHub!)
permissions:
  id-token: write
  contents: read
  pull-requests: write
  actions: read

env:
  TF_VERSION: 1.10.0
  PYTHON_VERSION: '3.11'
  
jobs:
  terraform-validate:
    name: Terraform Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      
      - name: Terraform fmt check
        run: |
          cd terraform
          terraform fmt -check -recursive
      
      - name: Terraform validate
        run: |
          cd terraform
          terraform init -backend=false
          terraform validate

  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    needs: terraform-validate
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'plan')
    environment: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment || 'prod' }}
    outputs:
      plan_output: ${{ steps.plan.outputs.stdout }}
      has_changes: ${{ steps.plan.outputs.exitcode }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      
      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}
          role-session-name: GitHubActions-Plan-${{ github.run_id }}
          role-duration-seconds: 3600
      
      - name: Terraform Init
        run: |
          cd terraform
          terraform init
      
      - name: Terraform Plan
        id: plan
        run: |
          cd terraform
          terraform plan -no-color \
            -var="environment=${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment || 'prod' }}" \
            -var="contact_email=${{ secrets.CONTACT_EMAIL }}" \
            -var="github_repository=${{ github.repository }}" \
            -var="enable_slack_notifications=${{ secrets.ENABLE_SLACK_NOTIFICATIONS || 'false' }}" \
            -var="slack_webhook_url=${{ secrets.SLACK_WEBHOOK_URL || '' }}" \
            -out=tfplan
          exitcode=$?
          echo "exitcode=$exitcode" >> $GITHUB_OUTPUT
          
          # Display plan output
          terraform show -no-color tfplan
        continue-on-error: true
      
      - name: Save Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: terraform/tfplan
          retention-days: 7
      
      - name: Comment PR with Plan
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        env:
          PLAN: ${{ steps.plan.outputs.stdout }}
        with:
          script: |
            const plan = process.env.PLAN;
            const hasChanges = ${{ steps.plan.outputs.exitcode }};
            
            let comment = '#### Terraform Plan 📋\n\n';
            
            if (hasChanges === 2) {
              comment += '❌ **Plan failed!** Please check the logs.\n\n';
            } else if (hasChanges === 1) {
              comment += '🟡 **Infrastructure changes detected**\n\n';
            } else {
              comment += '✅ **No changes** - Infrastructure is up to date\n\n';
            }
            
            if (plan && plan.length < 65000) {
              comment += '<details><summary>Show Plan</summary>\n\n```hcl\n' + plan + '\n```\n</details>';
            } else if (plan && plan.length >= 65000) {
              comment += 'Plan output is too large. Please check the Actions tab for details.';
            }
            
            comment += '\n\n---\n';
            comment += '🔄 **Workflow Details**\n';
            comment += `- **Run ID:** ${context.runId}\n`;
            comment += `- **Triggered by:** ${context.actor}\n`;
            comment += `- **Environment:** ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment || 'prod' }}\n`;
            
            const { data: comments } = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            
            const botComment = comments.find(comment => 
              comment.user.type === 'Bot' && comment.body.includes('Terraform Plan')
            );
            
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: comment
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
            }
      
      - name: Notify Slack on Plan Failure
        if: failure() && github.event_name == 'pull_request' && secrets.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@v1.26
        with:
          payload: |
            {
              "text": "❌ Terraform Plan Failed",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "❌ Terraform Plan Failed",
                    "emoji": true
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*Repository:*\n${{ github.repository }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*PR:*\n#${{ github.event.pull_request.number }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Author:*\n${{ github.actor }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Action:*\n<https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Logs>"
                    }
                  ]
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: terraform-plan
    if: |
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging') && 
      (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply'))
    environment: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment || (github.ref == 'refs/heads/main' && 'prod' || 'staging') }}
    outputs:
      s3_bucket_name: ${{ steps.terraform_outputs.outputs.s3_bucket_name }}
      cloudfront_domain: ${{ steps.terraform_outputs.outputs.cloudfront_domain }}
      cloudfront_distribution_id: ${{ steps.terraform_outputs.outputs.cloudfront_distribution_id }}
      api_gateway_url: ${{ steps.terraform_outputs.outputs.api_gateway_url }}
      aws_region: ${{ steps.terraform_outputs.outputs.aws_region }}
      github_role_arn: ${{ steps.terraform_outputs.outputs.github_role_arn }}
      visitor_counter_table: ${{ steps.terraform_outputs.outputs.visitor_counter_table }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      
      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}
          role-session-name: GitHubActions-Apply-${{ github.run_id }}
          role-duration-seconds: 5400
      
      - name: Download Plan Artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: terraform
      
      - name: Terraform Apply
        id: apply
        run: |
          cd terraform
          terraform init
          
          # Apply the plan
          terraform apply -auto-approve tfplan
          
          # Capture outputs
          echo "s3_bucket_name=$(terraform output -raw s3_bucket_name 2>/dev/null || echo 'not_found')" >> $GITHUB_OUTPUT
          echo "cloudfront_domain=$(terraform output -raw cloudfront_domain 2>/dev/null || echo 'not_found')" >> $GITHUB_OUTPUT
          echo "cloudfront_distribution_id=$(terraform output -raw cloudfront_distribution_id 2>/dev/null || echo 'not_found')" >> $GITHUB_OUTPUT
          echo "api_gateway_url=$(terraform output -raw api_gateway_url 2>/dev/null || echo 'not_found')" >> $GITHUB_OUTPUT
          echo "aws_region=$(terraform output -raw aws_region 2>/dev/null || echo 'us-east-1')" >> $GITHUB_OUTPUT
          echo "github_role_arn=$(terraform output -raw static_website_github_role_arn 2>/dev/null || echo 'not_found')" >> $GITHUB_OUTPUT
          echo "visitor_counter_table=$(terraform output -raw visitor_counter_table 2>/dev/null || echo 'not_found')" >> $GITHUB_OUTPUT
        id: terraform_outputs

  deploy-website:
    name: Deploy Website to S3
    runs-on: ubuntu-latest
    needs: terraform-apply
    if: success() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ needs.terraform-apply.outputs.github_role_arn }}
          aws-region: ${{ needs.terraform-apply.outputs.aws_region }}
          role-session-name: GitHubActions-Deploy-${{ github.run_id }}
          role-duration-seconds: 3600
      
      - name: Build Website Assets (if needed)
        run: |
          cd website
          # If you have npm scripts, uncomment below
          # npm install
          # npm run build
          echo "✅ Website ready for deployment"
      
      - name: Sync Website to S3
        run: |
          aws s3 sync ./website/ s3://${{ needs.terraform-apply.outputs.s3_bucket_name }}/ \
            --delete \
            --exclude ".env*" \
            --exclude "*.md" \
            --exclude ".git*" \
            --cache-control "max-age=3600" \
            --metadata-directive REPLACE
          
          # Set longer cache for assets
          aws s3 sync ./website/assets/ s3://${{ needs.terraform-apply.outputs.s3_bucket_name }}/assets/ \
            --delete \
            --cache-control "max-age=31536000" \
            --metadata-directive REPLACE
      
      - name: Invalidate CloudFront Cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ needs.terraform-apply.outputs.cloudfront_distribution_id }} \
            --paths "/*" \
            --output json
      
      - name: Wait for Invalidation Complete
        run: |
          echo "Waiting for CloudFront invalidation to complete..."
          sleep 30
          echo "✅ Cache invalidation initiated"
      
      - name: Verify Deployment
        run: |
          # Test website accessibility
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://${{ needs.terraform-apply.outputs.cloudfront_domain }})
          
          if [ $HTTP_STATUS -eq 200 ]; then
            echo "✅ Website is accessible (Status: $HTTP_STATUS)"
          else
            echo "⚠️ Website returned status: $HTTP_STATUS"
          fi
          
          # Test API Gateway
          if [ "${{ needs.terraform-apply.outputs.api_gateway_url }}" != "not_found" ]; then
            API_STATUS=$(curl -s -o /dev/null -w "%{http_code}" ${{ needs.terraform-apply.outputs.api_gateway_url }}/counter?page=test)
            echo "✅ API Gateway is accessible (Status: $API_STATUS)"
          fi

  slack-notification:
    name: Send Slack Notification
    runs-on: ubuntu-latest
    needs: [terraform-apply, deploy-website]
    if: always() && secrets.SLACK_WEBHOOK_URL != '' && github.event.inputs.skip_slack != true
    steps:
      - name: Send Deployment Status to Slack
        uses: slackapi/slack-github-action@v1.26
        with:
          payload: |
            {
              "text": "${{ needs.terraform-apply.result == 'success' && '✅' || '❌' }} Deployment ${{ needs.terraform-apply.result == 'success' && 'Success' || 'Failed' }}",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "${{ needs.terraform-apply.result == 'success' && '✅ Deployment Successful!' || '❌ Deployment Failed!' }}",
                    "emoji": true
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*Repository:*\n${{ github.repository }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Branch:*\n${{ github.ref_name }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Environment:*\n${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment || (github.ref == 'refs/heads/main' && 'Production' || 'Staging') }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Triggered by:*\n${{ github.actor }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Commit:*\n<${{ github.event.pull_request.html_url || github.event.head_commit.url }}|${GITHUB_SHA::7}>"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Action:*\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Logs>"
                    }
                  ]
                },
                {
                  "type": "section",
                  "fields": ${{ needs.terraform-apply.result == 'success' && toJSON([
                    {"type": "mrkdwn", "text": "*🌐 Website:*\nhttps://${{ needs.terraform-apply.outputs.cloudfront_domain }}"},
                    {"type": "mrkdwn", "text": "*📦 S3 Bucket:*\n${{ needs.terraform-apply.outputs.s3_bucket_name }}"},
                    {"type": "mrkdwn", "text": "*🔗 CloudFront:*\n${{ needs.terraform-apply.outputs.cloudfront_distribution_id }}"},
                    {"type": "mrkdwn", "text": "*🔌 API Gateway:*\n${{ needs.terraform-apply.outputs.api_gateway_url }}"}
                  ]) || toJSON([
                    {"type": "mrkdwn", "text": "*Error:*\nCheck GitHub Actions logs for details"}
                  ]) }}
                },
                {
                  "type": "context",
                  "elements": [
                    {
                      "type": "mrkdwn",
                      "text": "🕐 Deployed at: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
                    }
                  ]
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [terraform-apply]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
      
      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'
      
      - name: Check for exposed secrets
        run: |
          cd terraform
          # Check for hardcoded secrets in Terraform files
          if grep -r "access_key\|secret_key\|password" --include="*.tf" --include="*.tfvars" .; then
            echo "⚠️ WARNING: Potential hardcoded secrets found in Terraform files!"
            exit 1
          else
            echo "✅ No hardcoded secrets detected"
          fi

  cleanup:
    name: Cleanup Old Artifacts
    runs-on: ubuntu-latest
    needs: [deploy-website]
    if: always()
    steps:
      - name: Delete old artifacts
        uses: actions/github-script@v7
        with:
          script: |
            const artifacts = await github.rest.actions.listArtifactsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            
            const oldArtifacts = artifacts.data.artifacts.filter(
              artifact => artifact.created_at < new Date(Date.now() - 7 * 24 * 60 * 60 * 1000).toISOString()
            );
            
            for (const artifact of oldArtifacts) {
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: artifact.id,
              });
              console.log(`Deleted artifact: ${artifact.name}`);
            }
            
            console.log(`Cleaned up ${oldArtifacts.length} old artifacts`);

  summary:
    name: Deployment Summary
    runs-on: ubuntu-latest
    needs: [deploy-website, slack-notification]
    if: always()
    steps:
      - name: Generate Summary
        run: |
          echo "## 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Status** | ${{ needs.deploy-website.result == 'success' && '✅ Success' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Environment** | ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment || (github.ref == 'refs/heads/main' && 'Production' || 'Staging') }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Branch** | ${{ github.ref_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | ${{ github.sha }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Triggered by** | ${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ needs.deploy-website.result }}" == "success" ]; then
            echo "### 🌐 Access Your Website" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "- **Website URL:** https://${{ needs.terraform-apply.outputs.cloudfront_domain }}" >> $GITHUB_STEP_SUMMARY
            echo "- **API Gateway:** ${{ needs.terraform-apply.outputs.api_gateway_url }}" >> $GITHUB_STEP_SUMMARY
            echo "- **CloudFront ID:** ${{ needs.terraform-apply.outputs.cloudfront_distribution_id }}" >> $GITHUB_STEP_SUMMARY
            echo "- **S3 Bucket:** ${{ needs.terraform-apply.outputs.s3_bucket_name }}" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### 📊 Next Steps" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "1. Verify email in SES for contact form" >> $GITHUB_STEP_SUMMARY
            echo "2. Configure custom domain if needed" >> $GITHUB_STEP_SUMMARY
            echo "3. Set up CloudWatch dashboards for monitoring" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔗 Useful Links" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- [View Run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY
          echo "- [AWS Console](https://console.aws.amazon.com/)" >> $GITHUB_STEP_SUMMARY