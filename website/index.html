<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Static Website</title>
    <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <ul class="nav-menu">
                <li><a href="/">Home</a></li>
                <li><a href="/gallery.html">Gallery</a></li>
                 <li><a href="/maintenance.html">Maintenamce</a></li>
                 <li><a href="/error.html">Error</a></li>
            </ul>
        </div>
    </nav>
    
    <main class="container">
        <h1>Welcome to My Static Website</h1>
        <p>This website is hosted on AWS S3 and served via CloudFront CDN.</p>
        
        <div class="counter">
            <p>Visitors Counter: <span id="visitor-count">Loading...</span></p>
        </div>
        
        <div class="contact-form">
            <h2>Contact Us for Help</h2>
            <form id="contactForm">
                <input type="text" id="name" placeholder="Name" required>
                <input type="email" id="email" placeholder="Email" required>
                <textarea id="message" placeholder="Message" required></textarea>
                <button type="submit">Send Message</button>
                <div id="formStatus"></div>
            </form>
        </div>
        <div> Designed by oluleye Oluseun </div>
    </main>
    
    <script src="/assets/js/main.js"></script>

</body>
</html>
